<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b2f2a" />
  <title>Balatro — Poker Roguelike</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23123c35'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23ff9d3c'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div id="app" class="app">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">BALATRO</div>
        <div class="brand-sub">POKER · ROGUELIKE · DECKBUILDER</div>
      </div>
      <div class="stat-strip" id="stat-strip" aria-live="polite"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="help-btn" title="Cómo jugar" aria-label="Cómo jugar">?</button>
        <button class="icon-btn" id="sound-btn" title="Sonido" aria-label="Sonido">♪</button>
        <button class="icon-btn" id="menu-btn" title="Menú" aria-label="Menú">☰</button>
      </div>
    </header>

    <main class="game-grid">
      <aside class="left-rail">
        <section class="panel blind-panel" id="blind-panel"></section>
        <div class="pile-row">
          <div class="pile" id="deck-pile">
            <div class="pile-cards" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="pile-label">MAZO</div>
            <div class="pile-count" id="deck-count">52</div>
          </div>
          <div class="pile discard-pile" id="discard-pile">
            <div class="pile-cards" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="pile-label">DESCARTE</div>
            <div class="pile-count" id="discard-count">0</div>
          </div>
        </div>
        <section class="panel run-panel" id="run-panel"></section>
      </aside>

      <section class="board">
        <div class="board-top">
          <div class="joker-zone">
            <div class="zone-title"><span>COMODINES</span><span class="zone-meta" id="joker-meta">0/5</span></div>
            <div class="joker-row" id="joker-row"></div>
          </div>
          <div class="consumable-zone">
            <div class="zone-title"><span>CONSUMIBLES</span><span class="zone-meta" id="consumable-meta">0/2</span></div>
            <div class="consumable-row" id="consumable-row"></div>
          </div>
        </div>

        <div class="table-center">
          <div class="blind-scoreboard" id="scoreboard">
            <div class="score-side round">
              <span class="score-caption">RONDA</span>
              <span class="score-value" id="round-score">0</span>
              <span class="score-target" id="round-target">/ 300</span>
            </div>
            <div class="score-side chips">
              <span class="score-caption">CHIPS</span>
              <span class="score-value" id="chip-total">0</span>
            </div>
            <div class="score-x">×</div>
            <div class="score-side mult">
              <span class="score-caption">MULT</span>
              <span class="score-value" id="mult-total">0</span>
            </div>
          </div>
          <div class="play-area" id="play-area">
            <div class="play-hint" id="play-hint">Selecciona hasta 5 cartas</div>
          </div>
          <div class="hand-info" id="hand-info"></div>
        </div>

        <div class="hand-zone">
          <div class="hand-row" id="hand-row"></div>
          <div class="action-row">
            <div class="action-left">
              <button class="btn btn-ghost" id="sort-rank-btn" title="Ordenar por rango">RANGO</button>
              <button class="btn btn-ghost" id="sort-suit-btn" title="Ordenar por palo">PALO</button>
            </div>
            <div class="action-main">
              <button class="btn btn-red" id="play-btn" disabled>JUGAR MANO</button>
              <button class="btn btn-blue" id="discard-btn" disabled>DESCARTAR</button>
            </div>
            <div class="action-right">
              <button class="btn btn-ghost" id="info-btn" title="Info de la partida">INFO</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="tooltip-root" class="tooltip-root" role="tooltip"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
